<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zomato Notes</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            🍽️ Zomato Notes
        </div>

        <nav class="nav">

            <input
                type="text"
                id="searchInput"
                placeholder="Search notes..."
            >

            <input
                type="text"
                id="smartSearchInput"
                placeholder="Smart Search (AI)..."
            >

            <button id="loginBtn">
                Login
            </button>

            <button id="profileBtn" style="display:none;">
                👤 Profile
            </button>

            <button id="logoutBtn" style="display:none;">
                 Logout
            </button>

        </nav>

    </header>

    <!-- ================= MAIN ================= -->

    <main class="container">

        <!-- ========= LEFT PANEL ========= -->

        <section class="sidebar">

            <h2>Add Note</h2>

            <form id="noteForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Title"
                    required
                >

                <textarea
                    id="content"
                    placeholder="Content"
                    rows="6"
                    required
                ></textarea>

   
<select id="tag" required>

    <option value="">Select Category</option>

    <option value="Work">💼 Work</option>

    <option value="Programming">💻 Programming</option>

    <option value="College">🎓 College</option>

    <option value="Personal">👤 Personal</option>

    <option value="Health">❤️ Health</option>

    <option value="Travel">✈️ Travel</option>

    <option value="Shopping">🛒 Shopping</option>

    <option value="Ideas">💡 Ideas</option>

    <option value="Recipes">🍕 Recipes</option>

    <option value="Others">📁 Others</option>

</select>

<input
    type="text"
    id="customCategory"
    placeholder="Enter Custom Category"
    class="hidden"
/>                    


                <button type="submit">
                    Create Note
                </button>

                <button id="cancelEditBtn" class="delete-btn hidden">
                      Cancel Edit
                </button>


                <hr>

<input
    type="file"
    id="importFile"
    accept=".txt"
>

<button id="importBtn">
    Import Notes
</button>
            </form>

            <hr>

            <h2>Categories</h2>

            <div id="categoryTree">

            </div>

        </section>

        <!-- ========= RIGHT PANEL ========= -->

        <section class="content">

            <div id="loading" class="hidden">

    <div class="loader"></div>

</div>

            <div id="error">

            </div>

            <div id="notesContainer">

            </div>

        </section>

    </main>


    <!-- ================= AUTH MODAL ================= -->

<div id="authModal" class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">Login</h2>

        <input
            type="text"
            id="name"
            placeholder="Name"
            style="display:none;"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button id="submitAuth">
            Login
        </button>

        <p id="toggleAuth">

            Don't have an account?

            <span>Register</span>

        </p>

    </div>

</div>


<div id="toast" class="toast"></div>


<!-- Delete Confirmation Modal -->

<div id="deleteModal" class="modal">

    <div class="modal-content">

        <h2>Delete Note</h2>

        <p>Are you sure you want to delete this note?</p>

        <div class="modal-actions">

            <button
                id="cancelDelete"
                class="edit-btn"
            >
                Cancel
            </button>

            <button
                id="confirmDelete"
                class="delete-btn"
            >
                Delete
            </button>

        </div>

    </div>

</div>


<!-- ================= PROFILE MODAL ================= -->

<div id="profileModal" class="modal">

    <div class="modal-content profile-modal">

        <div class="profile-header">

            <div class="profile-avatar">
                👤
            </div>

            <h2 id="profileName">
                User Name
            </h2>

            <p id="profileEmail">
                user@gmail.com
            </p>

        </div>

        <div class="profile-info">

            <div class="profile-item">
                <span>Total Notes</span>
                <strong id="profileNotes">0</strong>
            </div>

            <div class="profile-item">
                <span>Member Since</span>
                <strong id="profileJoined">2026</strong>
            </div>

        </div>

        <button
            id="editProfileBtn"
            class="btn-primary"
            type="button">
            Edit Profile
        </button>

        <button
            id="closeProfileBtn"
            class="delete-btn"
            type="button">
            Close
        </button>

    </div>

</div>


<!-- ================= EDIT PROFILE MODAL ================= -->

<div id="editProfileModal" class="modal">

    <div class="modal-content">

        <h2>Edit Profile</h2>

        <form id="editProfileForm" class="edit-profile-form">

            <input
                type="text"
                id="editName"
                placeholder="Enter Name"
                required
            >

            <input
                type="email"
                id="editEmail"
                placeholder="Enter Email"
                required
            >

            <div class="modal-actions">

                <button
                    type="submit"
                    class="btn-primary">
                    Save Changes
                </button>

                <button
                    id="cancelEditProfile"
                    type="button"
                    class="delete-btn">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 Zomato Notes • Powered by FastAPI + AI

        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
